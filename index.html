<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tasks — Todo</title>
<meta name="description" content="A fast, focused task tracker." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M5 12.5 10 17 19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="brand-name">Tasks</span>
    </div>
    <button type="button" id="add-task-btn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      Add task
    </button>
  </div>
</header>

<main id="main-content" class="app-main">

  <!-- Dashboard counters -->
  <section aria-label="Task summary">
    <div id="dashboard" class="dashboard"></div>
  </section>

  <!-- Toolbar: search, filters, sort -->
  <section class="toolbar" aria-label="Search and filter tasks">
    <div class="search-field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="search" id="search-input" placeholder="Search by task, notes, or ID" aria-label="Search tasks" />
    </div>

    <div class="filter-group">
      <label class="visually-hidden" for="filter-status">Filter by status</label>
      <select id="filter-status" class="select-control">
        <option value="All">All statuses</option>
        <option value="Not Started">Not Started</option>
        <option value="In Progress">In Progress</option>
        <option value="On Hold">On Hold</option>
        <option value="Completed">Completed</option>
      </select>

      <label class="visually-hidden" for="filter-priority">Filter by priority</label>
      <select id="filter-priority" class="select-control">
        <option value="All">All priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>

      <label class="visually-hidden" for="filter-due-date">Filter by due date</label>
      <select id="filter-due-date" class="select-control">
        <option value="All">Any due date</option>
        <option value="overdue">Overdue</option>
        <option value="today">Due today</option>
        <option value="week">Due this week</option>
        <option value="none">No due date</option>
      </select>

      <label class="visually-hidden" for="sort-select">Sort tasks</label>
      <select id="sort-select" class="select-control">
        <option value="dueDate">Sort: Due date</option>
        <option value="priority">Sort: Priority</option>
        <option value="newest">Sort: Newest</option>
        <option value="oldest">Sort: Oldest</option>
        <option value="updated">Sort: Recently updated</option>
        <option value="completed">Sort: Recently completed</option>
      </select>

      <button type="button" id="clear-filters-btn" class="btn btn-ghost">Clear</button>
    </div>
  </section>

  <!-- Task list -->
  <section aria-label="Tasks" class="task-list-section">
    <div id="task-list-state"></div>
    <div id="task-list" class="task-list" hidden></div>
  </section>

</main>

<!-- Task create/edit modal -->
<div id="modal-overlay" class="overlay" hidden>
  <div id="task-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">Add New Task</h2>
      <button type="button" id="modal-close-btn" class="icon-btn" aria-label="Close dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="task-form" class="modal-body" novalidate>
      <input type="hidden" name="id" />

      <div class="field">
        <label for="field-task">Task <span class="required" aria-hidden="true">*</span></label>
        <input type="text" id="field-task" name="task" maxlength="200" required aria-describedby="error-task" />
        <p class="field-error" id="error-task" role="alert"></p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="field-due-date">Due date</label>
          <input type="date" id="field-due-date" name="dueDate" aria-describedby="error-dueDate" />
          <p class="field-error" id="error-dueDate" role="alert"></p>
        </div>

        <div class="field">
          <label for="field-priority">Priority <span class="required" aria-hidden="true">*</span></label>
          <select id="field-priority" name="priority" required aria-describedby="error-priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
          <p class="field-error" id="error-priority" role="alert"></p>
        </div>
      </div>

      <div class="field">
        <label for="field-status">Status</label>
        <select id="field-status" name="status" aria-describedby="error-status">
          <option value="Not Started">Not Started</option>
          <option value="In Progress">In Progress</option>
          <option value="On Hold">On Hold</option>
          <option value="Completed">Completed</option>
        </select>
        <p class="field-error" id="error-status"></p>
      </div>

      <div class="field">
        <label for="field-notes">Notes</label>
        <textarea id="field-notes" name="notes" rows="4" maxlength="2000" aria-describedby="error-notes"></textarea>
        <p class="field-error" id="error-notes" role="alert"></p>
      </div>

      <div class="modal-footer">
        <button type="button" id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="submit" id="modal-save-btn" class="btn btn-primary">Save Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm delete modal -->
<div id="confirm-overlay" class="overlay" hidden>
  <div id="confirm-modal" class="modal modal-small" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-header">
      <h2 id="confirm-title">Delete task</h2>
    </div>
    <div class="modal-body">
      <p id="confirm-message">Are you sure?</p>
      <div class="modal-footer">
        <button type="button" id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirm-ok-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Toasts -->
<div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

<script src="js/validation.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
